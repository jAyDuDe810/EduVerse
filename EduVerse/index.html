<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduVerse - Learn Anything, Anywhere</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav class="navbar">
      <a href="index.html" class="logo">EduVerse</a>
      <ul class="nav-links">
        <li><a href="#courses">Courses</a></li>
        <li><a href="#scanner">Scanner</a></li>
        <li><button id="auth-btn">Log In</button></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>Welcome to EduVerse</h1>
      <p>Your interactive universe for learning and growth.</p>
      <button id="get-started-btn">Get Started</button>
    </section>

    <!-- YouTube Scanner Interface -->
    <section id="scanner" class="scanner-section">
      <h2>YouTube Site & Link Scanner</h2>
      <div class="scanner-controls">
        <input type="text" id="yt-search-query" placeholder="e.g. educational tools, math games..." value="educational games" />
        <input type="text" id="yt-api-key" placeholder="Enter YouTube API Key (Optional)" />
        <button id="btn-run-scan" class="btn">Scan YouTube</button>
      </div>

      <div id="scan-status" class="status-text">Ready to scan.</div>
      <div id="scan-results" class="card-grid"></div>
    </section>

    <section id="courses" class="courses-section">
      <h2>Featured Courses</h2>
      <div id="course-list" class="card-grid">
        <!-- Dynamic course catalog -->
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 EduVerse. All rights reserved.</p>
  </footer>

  <!-- Load Modules -->
  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
